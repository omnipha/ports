notes: >
  wlan0 ath10k_snoc comes up with EEPROM regdomain 0x0, which the ath driver
  maps to CTRY_UNITED_STATES, hard-disabling ch 12/13 in 2.4 GHz. Our patch
  maps unprogrammed EEPROMs to WOR5_ETSIC (0x65) and uses ath_world_regdom_63_65
  as custom base so channels 12/13 remain enabled.
  Verified 2026-10-18: a WPA2 network on channel 13 (2472 MHz) connects with
  options cfg80211 ieee80211_regdom=DE. 5 GHz (DFS ch 116) crashes wlan firmware
  (halphy_caldb.c assertion) — separate issue, not fixed by the regdom patch.
  Runtime USB role switching works with the stock kernel: a boot-DTB-only
  change (dr_mode=otg, usb-role-switch, role-switch-default-mode=host) exposes
  /sys/class/usb_role/a600000.usb-role-switch/role which switches live between
  host and device without reboot. Verified 2026-10-19: host mode enumerates a
  powered hub, RTL8152 Ethernet, video adapter and card reader (/dev/sda);
  device mode releases the port and the UDC returns. Boot default is device.
  VBUS without an externally powered hub is untested.

