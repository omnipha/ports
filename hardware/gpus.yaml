# GPU facts and external benchmark data, keyed by GPU id.
# Benchmarks are Android results reported by the source. They rank GPUs, they do not
# predict Linux performance. Measured Linux results belong in device.yaml.
# Every benchmark needs source, n (sample count) and checked.

adreno-740:
  vendor: Qualcomm
  name: Adreno 740
  benchmarks:
    3dmark_wild_life_extreme_unlimited: {avg: 3641, min: 3088, max: 3900, n: 32, source: "https://www.notebookcheck.net/Qualcomm-Adreno-740-GPU-Benchmarks-and-Specs.669947.0.html", checked: "2026-10-22"}
    geekbench6_opencl: {avg: 8858, min: 6548, max: 9784, n: 21, source: "https://www.notebookcheck.net/Qualcomm-Adreno-740-GPU-Benchmarks-and-Specs.669947.0.html", checked: "2026-10-22"}

