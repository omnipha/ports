# SoC id (device.yaml `soc`) to GPU id in gpus.yaml.
# A SoC listed here has a GPU we can name with a source. Missing SoCs are simply not
# mapped yet; they appear in GPU.md as "GPU unknown".
# `note` records variants that share the GPU model but differ in clock.

sm8550:
  gpu: adreno-740
  source: "https://www.notebookcheck.net/Qualcomm-Adreno-740-GPU-Benchmarks-and-Specs.669947.0.html"
  checked: "2026-10-22"
  note: Snapdragon 8 Gen 2

sm8475:
